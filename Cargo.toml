[package]
name = "diskspace"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diskspace"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = "0.27"
sysinfo = "0.30"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
